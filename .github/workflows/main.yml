name: Build and Deploy LaTeX Document

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cyrillic LaTeX environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-xetex \
            texlive-lang-cyrillic \
            fonts-dejavu \
            latexmk

      - name: Build LaTeX document
        run: |
          latexmk -pdf -interaction=nonstopmode -file-line-error problems.tex

      - name: Build lectures (one PDF per .tex in lectures/)
        run: |
          set -e
          mkdir -p dist/lectures
          cd lectures
          for f in *.tex; do
            base="${f%.tex}"
            echo ">> Building $base.tex"
            xelatex -interaction=nonstopmode -file-line-error "$base.tex"
            xelatex -interaction=nonstopmode -file-line-error "$base.tex"
          done
          cp -f *.pdf ../dist/lectures/

      - name: Build midterm question bank
        run: |
          cd test1
          python3 generate_latex.py
          latexmk -pdf -interaction=nonstopmode -file-line-error output
          mkdir -p ../dist/test1
          cp -f output.pdf ../dist/test1/output.pdf

      - name: Build end-of-semester question bank
        run: |
          cd test2
          python3 ../test1/generate_latex.py
          latexmk -pdf -interaction=nonstopmode -file-line-error output
          mkdir -p ../dist/test2
          cp -f output.pdf ../dist/test2/output.pdf

      - name: Prepare dist directory
        run: |
          mkdir -p dist
          cp problems.pdf dist/
          cp index.html dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: pages
          keep_files: true
